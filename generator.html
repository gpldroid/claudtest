<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مولّد التطبيقات — Web2APK</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><header><a class="brand" href="index.html">◈ Web2APK</a><nav><a href="index.html">الرئيسية</a><a href="dashboard/">لوحة التحكم</a><a href="login.html">الحساب</a></nav></header><main class="wrap"><h1>إنشاء تطبيق أندرويد</h1><form id="generatorForm" class="panel grid"><label>رابط الموقع<input id="siteUrl" type="url" placeholder="https://example.com" required></label><label>اسم التطبيق<input id="appName" value="My Website" required></label><label>معرّف الحزمة<input id="packageId" value="com.example.myapp" required dir="ltr"></label><label>الأيقونة<input id="appIcon" value="🌐"></label><label>اللون الأساسي<input id="primaryColor" type="color" value="#536dfe"></label><label>نص شاشة البداية<input id="splashText" value="Welcome"></label><fieldset><legend>الصلاحيات</legend><label><input type="checkbox" value="CAMERA"> الكاميرا</label><label><input type="checkbox" value="ACCESS_FINE_LOCATION"> الموقع</label><label><input type="checkbox" value="RECORD_AUDIO"> الميكروفون</label></fieldset><button class="btn primary" type="submit">إنشاء وتنزيل ZIP</button><p id="generatorMessage"></p></form></main><script type="module" src="assets/js/generator.js"></script></body></html>
