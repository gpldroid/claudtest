<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإعدادات — Web2APK</title>
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="../assets/css/modern.css"><script src="../assets/js/site-ui.js" defer></script></head>
<body>
<header><a class="brand" href="../index.html">◈ Web2APK</a><nav><a href="index.html">الرئيسية</a><a href="projects.html">المشاريع</a></nav></header>
<main class="narrow panel">
<h1>إعدادات الحساب</h1>
<p class="muted">إعداد توقيع APK/AAB يتم عبر GitHub Repository Secrets. القيم الحساسة لا تُحفظ في Web2APK أو Supabase ولا تُعرض بعد الحفظ.</p>
<form id="signingForm">
<label>المشروع
<select id="projectSelect" required><option>جارٍ التحميل…</option></select>
</label>
<label>Keystore بصيغة Base64
<input id="keystoreBase64" type="password" required autocomplete="new-password" spellcheck="false">
</label>
<label>كلمة مرور keystore
<input id="storePassword" type="password" required autocomplete="new-password"></label>
<label>Alias (اسم المفتاح فقط، وليس كلمة المرور)
<input id="keyAlias" required autocomplete="off"></label>
<label>كلمة مرور المفتاح
<input id="keyPassword" type="password" required autocomplete="new-password"></label>
<button class="btn primary" type="submit">حفظ في GitHub Secrets</button>
</form>
<p id="settingsMessage" role="status"></p>
<button id="signOut" class="btn">تسجيل الخروج</button>
</main>
<script type="module" src="../assets/js/settings.js"></script>
</body></html>
